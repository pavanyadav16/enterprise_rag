# =============================================================================
# Enterprise RAG v2.0.8 — Docker Compose
# =============================================================================
#
# Services (Dockerised):
#   nginx            — reverse proxy + JWT auth_request (port 80 / 443)
#   backend          — FastAPI + Uvicorn RAG API        (internal :8000)
#   model-server     — Sentence-Transformer embeddings  (internal :8502)
#   open-webui       — Chat frontend                    (internal :8080)
#   owui-auth-proxy  — JWT → Open WebUI auto-login      (internal :8081)
#
# External (NOT in Docker — you supply these):
#   SQL Server       — set DB_HOST / DB_PORT in .env
#   PostgreSQL+pgvec — set PGVECTOR_HOST / PGVECTOR_PORT in .env
#
# Startup order:
#   model-server → backend → open-webui → owui-auth-proxy → nginx
#
# Usage:
#   cp .env.example .env     # fill in DB credentials and LLM endpoints
#   docker compose build
#   docker compose up -d
#   docker compose logs -f backend
# =============================================================================

# ---------------------------------------------------------------------------
# Shared network — all Docker services communicate on this bridge.
# The backend reaches external SQL Server / PGVector via the host network
# using the hostnames set in .env (DB_HOST, PGVECTOR_HOST).
# ---------------------------------------------------------------------------
networks:
  ragnet:
    driver: bridge

# ---------------------------------------------------------------------------
# Named volumes (only for Docker-managed services)
# ---------------------------------------------------------------------------
volumes:
  model_cache:    {}   # HuggingFace model cache (auto-downloaded on first boot)
  source_files:   {}   # Admin-uploaded knowledge source files
  chat_uploads:   {}   # Temporary chat session uploads (in-memory use)
  backend_logs:   {}   # Application log files
  owui_data:      {}   # Open WebUI persistence (conversations, settings)

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ── Embedding Model Server ─────────────────────────────────────────────────
  model-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.model_server
    container_name: rag-model-server
    image: enterprise-rag/model-server:2.0.8
    environment:
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}"
      EMBEDDING_DEVICE:     "${EMBEDDING_DEVICE:-cpu}"
      HF_HOME:              "/models/cache"
      HUGGINGFACE_HUB_CACHE: "/models/cache"
      XDG_CACHE_HOME:       "/models/cache"
      TRANSFORMERS_CACHE:   "/models/cache"
      MODEL_SERVER_HOST:    "0.0.0.0"
      MODEL_SERVER_PORT:    "8502"
    volumes:
      # Model cache is stored INSIDE the container at /models/cache
      # Downloaded automatically from HuggingFace Hub on first startup.
      # No local model files or volume mounts needed.
      - model_cache:/models/cache   # persist cache across container recreations
      - ./backend/conf:/app/conf:ro
    networks:
      - ragnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/health"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 180s   # first boot downloads ~90MB model from HuggingFace Hub

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    image: enterprise-rag/backend:2.0.8
    environment:
      # ── External SQL Server ──────────────────────────────────────────────
      DB_HOST:               "${DB_HOST}"
      DB_PORT:               "${DB_PORT:-1433}"
      DB_NAME:               "${DB_NAME:-EnterpriseRAG}"
      DB_USERNAME:           "${DB_USERNAME}"
      DB_PASSWORD:           "${DB_PASSWORD}"

      # ── External PostgreSQL + pgvector ───────────────────────────────────
      PGVECTOR_HOST:         "${PGVECTOR_HOST}"
      PGVECTOR_PORT:         "${PGVECTOR_PORT:-5432}"
      PGVECTOR_DATABASE:     "${PGVECTOR_DB:-rag_vectors}"
      PGVECTOR_USERNAME:     "${PGVECTOR_USER}"
      PGVECTOR_PASSWORD:     "${PGVECTOR_PASSWORD}"

      # ── Internal services ────────────────────────────────────────────────
      MODEL_SERVER_HOST:     "model-server"
      MODEL_SERVER_PORT:     "8502"

      # ── LLM API ─────────────────────────────────────────────────────────
      LLM_TOKEN_URL:         "${LLM_TOKEN_URL}"
      LLM_GENERATE_URL:      "${LLM_GENERATE_URL}"
      LLM_USERNAME:          "${LLM_USERNAME}"
      LLM_PASSWORD:          "${LLM_PASSWORD}"

      # ── App ──────────────────────────────────────────────────────────────
      APP_DEV_MODE:          "${APP_DEV_MODE:-false}"

      # ── Open WebUI ───────────────────────────────────────────────────────
      OPENWEBUI_ADMIN_EMAIL:       "${OWUI_ADMIN_EMAIL}"
      OPENWEBUI_ADMIN_PASSWORD:    "${OWUI_ADMIN_PASSWORD}"
      OPENWEBUI_INTERNAL_URL:      "http://open-webui:8080"
      OPENWEBUI_AUTO_LOGIN_SECRET: "${OWUI_AUTO_LOGIN_SECRET}"
    volumes:
      - source_files:/app/source-files
      - chat_uploads:/app/chat-uploads
      - backend_logs:/app/logs
      - ./backend/conf:/app/conf:ro
    networks:
      - ragnet
    depends_on:
      model-server:
        condition: service_healthy
    # NOTE: external SQL Server and PGVector are checked by the backend's
    # own startup logic and the /api/v1/health/ready endpoint — not here,
    # because Docker cannot health-check external hosts.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Open WebUI ─────────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rag-open-webui
    environment:
      ENABLE_SIGNUP:    "false"
      ENABLE_OLLAMA_API: "false"
      DEFAULT_MODELS:   "enterprise-rag"
      WEBUI_SECRET_KEY: "${OWUI_SECRET_KEY}"
      ADMIN_EMAIL:      "${OWUI_ADMIN_EMAIL}"
      DATA_DIR:         "/app/backend/data"
    volumes:
      - owui_data:/app/backend/data
    networks:
      - ragnet
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Open WebUI Auth Proxy ──────────────────────────────────────────────────
  owui-auth-proxy:
    build:
      context: ./openwebui-auth-proxy
      dockerfile: Dockerfile
    container_name: rag-auth-proxy
    image: enterprise-rag/auth-proxy:2.0.8
    environment:
      BACKEND_INTERNAL_URL: "http://backend:8000"
      OWUI_INTERNAL_URL:    "http://open-webui:8080"
      OWUI_ADMIN_EMAIL:     "${OWUI_ADMIN_EMAIL}"
      OWUI_ADMIN_PASSWORD:  "${OWUI_ADMIN_PASSWORD}"
      PORT:                 "8081"
      OWUI_STARTUP_WAIT:    "120"
    networks:
      - ragnet
    depends_on:
      backend:
        condition: service_healthy
      open-webui:
        condition: service_started   # open-webui is slow to become healthy; started is sufficient
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/auth-proxy/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: rag-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Uncomment for TLS:
      # - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - ragnet
    depends_on:
      backend:
        condition: service_healthy
      open-webui:
        condition: service_healthy
      owui-auth-proxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
