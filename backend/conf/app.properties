# =============================================================================
# Enterprise RAG v2.0.8 — Application Properties
# =============================================================================
#
# HOW THIS FILE IS USED
# ----------------------
# The properties_loader reads this file and exposes values via props.get().
# Priority order (highest wins):
#   1. Environment variable  (DB_HOST, PGVECTOR_PASSWORD, etc.)
#   2. Value in this file
#   3. Hard-coded default in the calling code
#
# IN DOCKER COMPOSE (normal deployment)
#   All credentials and hostnames are injected as environment variables
#   from your .env file via docker-compose.yml.  Those keys are marked
#   [OVERRIDDEN BY .env / docker-compose] below — the values here are
#   IGNORED at runtime and only serve as documentation.
#
#   The 36 keys marked [ACTIVE — read from this file] are NOT set by
#   docker-compose and are the actual live values used by the application.
#   Edit those here to change behaviour.
#
# WITHOUT DOCKER (running backend directly with uvicorn)
#   ALL keys in this file are used.  Set credentials directly here or
#   export the equivalent environment variables before starting.
#
# ENV VAR NAMING RULE
#   Replace dots with underscores and uppercase:
#   Example:  db.host  →  DB_HOST
#             rag.top_k_results  →  RAG_TOP_K_RESULTS
# =============================================================================


# =============================================================================
# SECTION 1 — Application General
# [ACTIVE — read from this file]
# =============================================================================
app.name=Enterprise RAG Chatbot
app.version=2.0.8
app.environment=dev
app.log_level=INFO
app.log_file=logs/app.log

# [OVERRIDDEN BY .env / docker-compose]  →  APP_DEV_MODE
# true  = bypass JWT (local dev only). false = full JWT enforcement.
app.dev_mode=false


# =============================================================================
# SECTION 2 — SQL Server  (external — YOUR server)
# ALL keys here are [OVERRIDDEN BY .env / docker-compose]
# Set DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD in your .env file.
# The values below are placeholders only — they are never used in Docker.
# =============================================================================
db.host=host.docker.internal
db.port=1433
db.name=EnterpriseRAG
db.username=sa
db.password=Test123

# [ACTIVE — read from this file]
# These tuning values are not set by docker-compose — edit here to change.
db.driver=ODBC Driver 18 for SQL Server
db.pool_size=10
db.max_overflow=20
db.pool_timeout=30


# =============================================================================
# SECTION 3 — PostgreSQL + pgvector  (external — YOUR server)
# ALL credential/host keys are [OVERRIDDEN BY .env / docker-compose]
# Set PGVECTOR_HOST, PGVECTOR_PORT, PGVECTOR_DB, PGVECTOR_USER,
# PGVECTOR_PASSWORD in your .env file.
# =============================================================================
pgvector.host=host.docker.internal
pgvector.port=5432
pgvector.database=rag_vectors
pgvector.username=postgres
pgvector.password=test

# [ACTIVE — read from this file]
pgvector.pool_size=5
pgvector.collection_name=rag_documents


# =============================================================================
# SECTION 4 — LLM API
# [OVERRIDDEN BY .env / docker-compose]
# Set LLM_TOKEN_URL, LLM_GENERATE_URL, LLM_USERNAME, LLM_PASSWORD in .env
# =============================================================================
llm.token_url=https://your-llm-host/api/v1/token
llm.generate_url=https://your-llm-host/api/v1/generate-text
llm.username=your_llm_user
llm.password=your_llm_password

# [ACTIVE — read from this file]
llm.token_expiry_buffer_seconds=60
llm.request_timeout_seconds=120
llm.max_retries=3
llm.system_prompt=You are a strict enterprise assistant. Answer ONLY based on the provided context. If you cannot find relevant information in the context, say so clearly. Do not make up information.


# =============================================================================
# SECTION 4b — Embedding Model Server  (Docker internal service)
# [OVERRIDDEN BY .env / docker-compose]
# These are set to the Docker service name in docker-compose.yml.
# Change only if running model-server outside Docker.
# =============================================================================
model_server.host=model-server
model_server.port=8502

# [ACTIVE — read from this file]
# HuggingFace Hub model ID — downloaded automatically on first container startup.
# Change this to use a different sentence-transformer model.
embedding.model_name=sentence-transformers/all-MiniLM-L6-v2
embedding.device=cpu

# [ACTIVE — read from this file]
embedding.batch_size=32
embedding.dimension=384


# =============================================================================
# SECTION 5 — Source File Upload
# [ACTIVE — read from this file]
# These are container-internal paths, correct for the Docker setup.
# =============================================================================
source.upload.directory=/app/source-files
upload.chat_temp_directory=/app/chat-uploads
upload.max_file_size_mb=50
upload.allowed_extensions=pdf,docx,doc,txt,png,jpg,jpeg,gif,bmp,xlsx,xls,csv


# =============================================================================
# SECTION 6 — Indexing Pipeline
# [ACTIVE — read from this file]
# Edit here to tune chunking and indexing behaviour.
# =============================================================================
indexing.chunk_size=512
indexing.chunk_overlap=64
indexing.index_on_startup=true
indexing.batch_size=50

# Leave blank to disable API key protection on the indexing endpoint.
# Set via environment variable INDEXING_API_KEY in production.
indexing.api_key=


# =============================================================================
# SECTION 7 — JWT Authentication
# [ACTIVE — read from this file]
# jwt.public_key_path is the path INSIDE the container (mounted volume).
# jwt.audience and jwt.issuer MUST match your Identity Provider settings.
# =============================================================================
jwt.public_key_path=/app/conf/jwt_public_key.pem
jwt.algorithm=RS256
jwt.audience=enterprise-rag
jwt.issuer=enterprise-idp
jwt.leeway_seconds=30


# =============================================================================
# SECTION 8 — RAG Retrieval
# [ACTIVE — read from this file]
# Edit here to tune retrieval quality vs. speed.
# =============================================================================
rag.top_k_results=5
rag.similarity_threshold=0.35
rag.max_context_tokens=3000


# =============================================================================
# SECTION 9 — Open WebUI Integration
# [OVERRIDDEN BY .env / docker-compose]
# admin_email and admin_password are set via OWUI_ADMIN_EMAIL / OWUI_ADMIN_PASSWORD
# auto_login_secret is set via OPENWEBUI_AUTO_LOGIN_SECRET
# internal_url is hardcoded to the Docker service name in docker-compose.yml
# =============================================================================
openwebui.internal_url=http://open-webui:8080
openwebui.admin_email=admin@yourcompany.com
openwebui.admin_password=ChangeMe123!
openwebui.auto_login_secret=change-this-secret-in-production

# [ACTIVE — read from this file]
# The model name shown to users in Open WebUI.
openwebui.model_name=Enterprise RAG


# =============================================================================
# SECTION 10 — CORS
# [ACTIVE — read from this file]
# Add your frontend origin if accessing the API from a browser directly.
# =============================================================================
cors.allowed_origins=http://localhost,http://localhost:3000,http://localhost:8080,http://open-webui:8080
