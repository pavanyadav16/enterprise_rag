# =============================================================================
# Enterprise RAG v2.0.8 — Nginx Virtual Host
# =============================================================================
#
# Traffic flow:
#   Browser → Nginx :80
#     /?token=<jwt>           → auth/owui-login → 302 → /auth-proxy/login
#     /auth-proxy/*           → openwebui-auth-proxy :8081  (no auth guard)
#     /api/*                  → FastAPI backend :8000         (JWT guard)
#     /                       → Open WebUI :8080              (cookie guard)
#
# JWT validation:
#   Every /api/* request triggers an auth_request sub-request to
#   /api/v1/auth/verify?token=<bearer>.  FastAPI validates the JWT and
#   returns 200 (allowed) or 401 (denied).  The response headers
#   X-User-Id, X-User-Name etc. are forwarded upstream.
# =============================================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream open_webui {
    server open-webui:8080;
    keepalive 32;
}

upstream auth_proxy {
    server owui-auth-proxy:8081;
    keepalive 16;
}

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# =============================================================================
# HTTP server
# =============================================================================
server {
    listen 80;
    server_name _;

    # ------------------------------------------------------------------
    # Deep-link entry point: /?token=<enterprise_jwt>
    # Nginx catches this before Open WebUI so we can trigger auto-login.
    # ------------------------------------------------------------------
    location = / {
        # If a ?token= query param is present, redirect to the login flow.
        if ($arg_token) {
            return 302 /api/v1/auth/owui-login?token=$arg_token;
        }
        # No token — proxy to Open WebUI normally (its own auth applies).
        proxy_pass         http://open_webui;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Auth proxy — no JWT guard (it handles its own token validation)
    # ------------------------------------------------------------------
    location /auth-proxy/ {
        limit_req zone=login_limit burst=10 nodelay;

        proxy_pass         http://auth_proxy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ------------------------------------------------------------------
    # FastAPI Backend — JWT-guarded via auth_request
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        # ── JWT validation sub-request ──────────────────────────────
        auth_request        /internal/auth-verify;
        auth_request_set    $auth_user_id    $upstream_http_x_user_id;
        auth_request_set    $auth_user_name  $upstream_http_x_user_name;
        auth_request_set    $auth_user_email $upstream_http_x_user_email;
        auth_request_set    $auth_user_roles $upstream_http_x_user_roles;
        auth_request_set    $auth_is_admin   $upstream_http_x_is_admin;

        # Forward validated user identity to backend
        proxy_set_header   X-User-Id    $auth_user_id;
        proxy_set_header   X-User-Name  $auth_user_name;
        proxy_set_header   X-User-Email $auth_user_email;
        proxy_set_header   X-User-Roles $auth_user_roles;
        proxy_set_header   X-Is-Admin   $auth_is_admin;

        # Excluded paths — auth sub-request is not applied to these
        # (handled below with location overrides)

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;

        # Handle auth errors cleanly
        error_page 401 = @error401;
        error_page 403 = @error403;
    }

    # Public API endpoints — no JWT guard required
    location ~ ^/api/v1/(health|auth/verify|auth/owui-login) {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Internal auth sub-request location ─────────────────────────────────
    # Not directly accessible from outside — Nginx-internal only.
    location = /internal/auth-verify {
        internal;

        # Extract token from Authorization header or ?token= query param
        set $auth_token "";
        if ($http_authorization ~* "^[Bb]earer\s+(.+)$") {
            set $auth_token $1;
        }
        if ($arg_token) {
            set $auth_token $arg_token;
        }

        proxy_pass             http://backend/api/v1/auth/verify?token=$auth_token;
        proxy_pass_request_body off;
        proxy_set_header       Content-Length "";
        proxy_set_header       X-Original-URI $request_uri;
        proxy_read_timeout     10s;
    }

    # ------------------------------------------------------------------
    # Open WebUI — all other traffic (SPA, WebSocket, static assets)
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://open_webui;
        proxy_http_version 1.1;
        # WebSocket support (Open WebUI uses socket.io)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # ------------------------------------------------------------------
    # Error pages
    # ------------------------------------------------------------------
    location @error401 {
        default_type application/json;
        return 401 '{"error":"Unauthorized","detail":"Valid JWT token required. Pass as Authorization: Bearer <token> or ?token=<jwt>"}';
    }

    location @error403 {
        default_type application/json;
        return 403 '{"error":"Forbidden","detail":"You do not have permission to access this resource."}';
    }

    # Block common probes
    location ~ /\. {
        deny all;
    }
}
